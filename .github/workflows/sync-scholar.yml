name: Sync Google Scholar publications

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch publications
        run: python3 scripts/sync_google_scholar.py

      - name: Commit changes
        run: |
          if git diff --quiet -- _data/google_scholar_publications.yml; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/google_scholar_publications.yml
          git commit -m "chore: sync Google Scholar publications"
          git push
